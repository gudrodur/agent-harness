# Runs each package's own tests on GitHub-hosted runners. No secrets, a
# read-only token, nothing here needs machine, account or network access.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  switchboard:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: packages/switchboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # The store parity test runs the lib under both runtimes against one
      # file (bun writes, node reads, and the reverse), so bun must be present.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Node suites
        run: node --import ./tests/helpers/isolate-setup.mjs --test tests/*.test.mjs
      - name: Node suites under an ambient store path (must not touch it)
        run: |
          ambient="$(mktemp -u)/ambient-state.db"
          AGENT_SWITCHBOARD_DB="$ambient" node --import ./tests/helpers/isolate-setup.mjs --test tests/*.test.mjs
          test ! -e "$ambient" || { echo "FAIL: suite wrote to ambient AGENT_SWITCHBOARD_DB=$ambient"; exit 1; }
      - name: Shell suite (headless kitty)
        run: |
          sudo apt-get update && sudo apt-get install -y kitty xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          nohup kitty -o allow_remote_control=yes --listen-on unix:/tmp/kitty-ci > /tmp/kitty-ci.log 2>&1 &
          export KITTY_LISTEN_ON=unix:/tmp/kitty-ci
          for i in $(seq 1 30); do kitty @ ls >/dev/null 2>&1 && break; sleep 1; done
          kitty @ ls
          bash tests/kitty-send.test.sh

  live-values:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: packages/live-values
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # The bundle is built with Bun, pinned so every build is byte-identical.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Run tests
        run: node --test tests/*.test.mjs tests/lib/*.test.mjs
      - name: Gate - bundle fresh
        run: node build.mjs --check
      - name: Gate - this package's docs match their sources
        run: node dist/live-values.mjs --check
